# Compile le projet avec MSVC (Visual Studio) sur une machine Windows de GitHub et lance FluxTests (GPU logiciel compris),
# pour chaque PR et chaque envoi sur master : les erreurs propres à MSVC sont vues avant de tester.
# (Pas à chaque envoi sur une branche : celles d'une PR seraient compilées deux fois.)
name: MSVC

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [msvc-debug, msvc-release]
    steps:
      - uses: actions/checkout@v4

      # cl.exe et l'environnement x64 de Visual Studio dans le PATH (comme le « Developer PowerShell »).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # slangc (compilateur de shaders) : pris dans la dernière version publiée de Slang, rangé comme dans le SDK Vulkan.
      - name: Slang
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo shader-slang/slang --pattern "slang-*-windows-x86_64.zip" --dir "$env:RUNNER_TEMP"
          $zip = Get-ChildItem "$env:RUNNER_TEMP\slang-*-windows-x86_64.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\slang"
          "VULKAN_SDK=$env:RUNNER_TEMP\slang" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Dépendances téléchargées par FetchContent : gardées d'une exécution à l'autre.
      - uses: actions/cache@v4
        with:
          path: out/deps/${{ matrix.preset }}
          key: deps-${{ matrix.preset }}-${{ hashFiles('cmake/FluxDependencies.cmake') }}

      - name: Configurer
        run: cmake --preset ${{ matrix.preset }}

      - name: Compiler
        run: cmake --build --preset ${{ matrix.preset }}

      # GPU logiciel (lavapipe de Mesa, compilé pour Windows par mesa-dist-win) et chargeur Vulkan de LunarG : les tests
      # GPU (compute, tuiles de planète, arbres) tournent au lieu d'être ignorés. FLUX_TESTS_GPU=1 les fait échouer si
      # le GPU manque, pour qu'une panne de cette étape ne passe pas pour un succès.
      - name: GPU logiciel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = "$env:RUNNER_TEMP\gpu"
          gh release download --repo pal1000/mesa-dist-win --pattern "mesa3d-*-release-msvc.7z" --dir $root
          $archive = Get-ChildItem "$root\mesa3d-*-release-msvc.7z" | Select-Object -First 1
          7z x $archive.FullName "-o$root\mesa" | Out-Null
          $icd = Get-ChildItem "$root\mesa\x64" -Filter "lvp_icd*.json" | Select-Object -First 1
          if (-not $icd) { Write-Error "lavapipe introuvable dans $($archive.Name)"; exit 1 }
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip" -OutFile "$root\runtime.zip"
          Expand-Archive "$root\runtime.zip" -DestinationPath "$root\runtime"
          $loader = Get-ChildItem "$root\runtime" -Recurse -Filter "vulkan-1.dll" | Where-Object { $_.DirectoryName -match 'x64' } | Select-Object -First 1
          if (-not $loader) { Write-Error "vulkan-1.dll introuvable"; exit 1 }
          $loader.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
          # Le chargeur ignore VK_DRIVER_FILES dans un processus administrateur (c'est le cas sur GitHub) : le pilote est
          # inscrit dans le registre, comme le ferait son installateur.
          $drivers = "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers"
          if (-not (Test-Path $drivers)) { New-Item -Path $drivers -Force | Out-Null }
          New-ItemProperty -Path $drivers -Name $icd.FullName -PropertyType DWord -Value 0 -Force | Out-Null
          "FLUX_TESTS_GPU=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "lavapipe : $($archive.Name) ; chargeur : $($loader.FullName)"

      - name: Tests
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure

      # Ninja doit connaître les en-têtes de chaque .cpp (sinon un .hpp modifié ne recompile rien) : voir CMakeLists.txt.
      - name: Suivi des en-têtes
        shell: pwsh
        run: |
          $deps = ninja -C out/build/${{ matrix.preset }} -t deps Engine/CMakeFiles/FluxEngine.dir/src/UI/Menus.cpp.obj
          $deps | Select-Object -First 12
          if (-not ($deps -match 'ContextImpl\.hpp')) { Write-Error "Ninja n'a pas enregistré ContextImpl.hpp pour Menus.cpp"; exit 1 }
